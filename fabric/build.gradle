plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    include "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation("dev.architectury:architectury-fabric:$rootProject.architectury_api_version") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    include "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    implementation "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"
    include "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"
    implementation "com.electronwill.night-config:core:3.8.1"
    implementation "com.electronwill.night-config:toml:3.8.1"

    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"

    implementation "com.github.TartaricAlkaline:ImageStream:b543665ea5"
    include "com.github.TartaricAlkaline:ImageStream:b543665ea5"



    compileOnly "maven.modrinth:iris:vTN4NRGW"

    // Pull common's compile output (named/mojmap) into fabric for both compile and dev-runtime.
    common(project(':common')) { transitive = false }
    // Must use transformProductionFabric (not namedElements) so architectury rewrites
    // @ExpectPlatform stubs to delegate to *Impl — otherwise runtime AssertionError.
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    from(project(':common').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// The regular jar task performs Loom's no-remap nested dependency processing.
jar {
    dependsOn shadowJar
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(shadowJar.archiveFile.get().asFile) }
}

// Preserve the Windows stack margin used by Mojang's 26.3 launcher.
// The same setting is used in the 26.2 Windows regression tests.
loom.runs.client {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        vmArg '-XX:StackShadowPages=32'
    }
    vmArg '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED'
}

// Opt-in reproducible local testing; it never changes an installed game profile.
if (project.hasProperty('portSmokeWorld')) {
    loom.runs.client {
        programArgs '--quickPlaySingleplayer', project.property('portSmokeWorld').toString()
        programArgs '--width', '1100', '--height', '700'
    }
}
